name: "Continuous Integration"

run-name: "Continuous Integration • ${{ github.ref_name }} @${{ github.actor }}"

concurrency:
    group: "ci-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

on:
    push:
        branches:
            - "main"
            - "master"
    pull_request:
    merge_group:
        types:
            - "checks_requested"

jobs:
    test:
        name: "Test (${{ matrix.label }})"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 60
        permissions:
            contents: "read"
            id-token: "write"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - label: "linux"
                      os: "ubuntu-latest"
                      codecov_flag: "os-linux"
                    - label: "windows"
                      os: "windows-latest"
                      codecov_flag: "os-windows"
                    - label: "macos"
                      os: "macos-latest"
                      codecov_flag: "os-macos"
        defaults:
            run:
                shell: "bash"
        env:
            CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              if: "${{ matrix.os == 'ubuntu-latest' }}"
              uses: "step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40" # v2.20.1
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Setup npm"
              working-directory: "${{ runner.temp }}"
              run: "npm install --global npm@12.0.2"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Build package"
              run: "npm run build"

            - name: "Upload bundle analysis to Codecov"
              if: "${{ matrix.os == 'ubuntu-latest' && !cancelled() && env.CODECOV_TOKEN != '' }}"
              continue-on-error: true
              run: |
                  npx @codecov/bundle-analyzer ./dist --bundle-name=eslint-plugin-file-progress-2 --upload-token="${CODECOV_TOKEN}"
              env:
                  GITHUB_SHA: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
                  GITHUB_REF: "${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}"

            - name: "Verify README rules table sync"
              run: "npm run sync:readme-rules-table"

            - name: "Typecheck"
              run: "npm run typecheck"

            - name: "Run tests with coverage and JUnit report"
              run: "npx vitest run --coverage --reporter=github-actions --reporter=dot --reporter=junit --outputFile=test-report.junit.xml --silent"
              env:
                  CI: "true"
                  MAX_THREADS: "1"
                  FILE_PROGRESS_VITEST_HANGING_PROCESS_REPORTER: "true"
                  VITEST_HANGING_PROCESS_REPORTER: "true"

            - name: "Verify coverage artifact"
              run: |
                  python -c "from pathlib import Path; assert Path('coverage/lcov.info').is_file(), 'coverage/lcov.info was not generated'"

            - name: "Verify JUnit artifact"
              run: |
                  python -c "from pathlib import Path; assert Path('test-report.junit.xml').is_file(), 'test-report.junit.xml was not generated'"

            - name: "Upload test results to Codecov"
              if: "${{ !cancelled() && hashFiles('test-report.junit.xml') != '' }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "Nick2bad4u/eslint-plugin-file-progress-2"
                  files: "test-report.junit.xml"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-junit-${{ matrix.codecov_flag }}"
                  report_type: "test_results"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

            - name: "Upload coverage to Codecov"
              if: "${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "Nick2bad4u/eslint-plugin-file-progress-2"
                  files: "./coverage/lcov.info"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-unit-coverage-${{ matrix.codecov_flag }}"
                  report_type: "coverage"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

    eslint9-compat:
        name: "ESLint 9 Compatibility (${{ matrix.label }})"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        permissions:
            contents: "read"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - eslint-js-version: "9.0.0"
                      eslint-version: "9.0.0"
                      label: "9.0.0"
                    - eslint-js-version: "^9.39.1"
                      eslint-version: "^9.39.1"
                      label: "9.latest"
        defaults:
            run:
                shell: "bash"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40" # v2.20.1
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Setup npm"
              working-directory: "${{ runner.temp }}"
              run: "npm install --global npm@12.0.2"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Build package"
              run: "npm run build"

            - name: "Pack compatibility candidate"
              id: "pack_candidate"
              run: |
                  pack_json_path="${RUNNER_TEMP}/npm-pack.json"
                  npm pack --json --pack-destination "${RUNNER_TEMP}" > "${pack_json_path}"
                  pack_filename="$(node scripts/resolve-npm-pack-filename.mjs < "${pack_json_path}")"
                  echo "package_path=${RUNNER_TEMP}/${pack_filename}" >> "${GITHUB_OUTPUT}"

            - name: "Install ESLint 9 compatibility consumer"
              env:
                  CANDIDATE_PACKAGE_PATH: "${{ steps.pack_candidate.outputs.package_path }}"
                  ESLINT_JS_VERSION: "${{ matrix.eslint-js-version }}"
                  ESLINT_VERSION: "${{ matrix.eslint-version }}"
              run: |
                  consumer_directory="$(mktemp -d "${RUNNER_TEMP}/eslint9-consumer.XXXXXX")"
                  mkdir -p "${consumer_directory}/scripts"
                  cp scripts/eslint9-compat-smoke.mjs "${consumer_directory}/scripts/"
                  cd "${consumer_directory}"
                  npm init --yes
                  npm install --package-lock=false \
                      "${CANDIDATE_PACKAGE_PATH}" \
                      "@eslint/js@${ESLINT_JS_VERSION}" \
                      "eslint@${ESLINT_VERSION}" \
                      "typescript@^6.0.2"
                  node scripts/eslint9-compat-smoke.mjs \
                      --expect-eslint-major=9 \
                      --use-installed-package
